name: CI - TypeScript

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'
  push:
    branches: [ main ]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'

permissions:
  contents: read

concurrency:
  group: ci-typescript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: typescript

jobs:
  check:
    name: Type-check, unit tests, build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the coverage upload with the job's OIDC token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check (format + lint + type-check + unit tests)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit test coverage
        if: matrix.node-version == '22'
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: typescript/coverage/lcov.info
          disable_search: true
          flags: typescript
          # Pull requests from forks get no OIDC token; Codecov accepts their uploads without one.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          # A failed upload fails the run on main, where the report matters, but not on pull requests.
          fail_ci_if_error: ${{ github.event_name == 'push' }}
