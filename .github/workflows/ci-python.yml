name: CI - Python

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  check:
    name: Lint, type-check, unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the coverage upload with the job's OIDC token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Ruff (lint)
        run: ruff check src tests

      - name: mypy (strict)
        run: mypy src

      - name: Unit tests (moto, no AWS credentials)
        # tests/integ is gated behind RUN_INTEG and is intentionally not run here.
        run: pytest tests -q --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: python/coverage.xml
          disable_search: true
          flags: python
          # Pull requests from forks get no OIDC token; Codecov accepts their uploads without one.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          # A failed upload fails the run on main, where the report matters, but not on pull requests.
          fail_ci_if_error: ${{ github.event_name == 'push' }}
