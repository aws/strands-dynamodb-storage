name: CI - Python

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  check:
    name: Lint, type-check, unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Ruff (lint)
        run: ruff check src tests

      - name: mypy (strict)
        run: mypy src

      - name: Unit tests (moto, no AWS credentials)
        # tests/integ is gated behind RUN_INTEG and is intentionally not run here.
        run: pytest tests -q
