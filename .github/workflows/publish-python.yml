name: Publish Python to PyPI

# Publishes the version in python/pyproject.toml ([project].version) for a
# `python-v*` tag (e.g. `python-v0.1.0`). Two triggers start it:
# - a GitHub Release published by a person, which sends the release event;
# - release-please.yml, which runs this with workflow_dispatch on the tag after
#   its release pull request merges. Releases it creates with GITHUB_TOKEN send
#   no release event. That pull request sets the version in both packages.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tag:
    name: Check tag is python-v*
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - id: check
        env:
          # A release event carries its tag; a workflow_dispatch run must be on the tag.
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag && "$TAG_NAME" == python-v* ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distribution
    needs: check-tag
    if: needs.check-tag.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install build tooling
        run: pip install hatch twine

      - name: Run checks
        run: |
          pip install -e '.[dev]'
          ruff check .
          mypy src
          pytest tests -q

      - name: Build package
        run: hatch build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Create a `pypi` environment in repo settings and register this repo as a
    # trusted publisher on PyPI (OIDC) — no long-lived API token is stored.
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
