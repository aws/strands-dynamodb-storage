name: Publish TypeScript to npm

# Publishes the version in typescript/package.json for a `typescript-v*` tag
# (e.g. `typescript-v0.1.0`). Two triggers start it:
# - a GitHub Release published by a person, which sends the release event;
# - release-please.yml, which runs this with workflow_dispatch on the tag after
#   its release pull request merges. Releases it creates with GITHUB_TOKEN send
#   no release event. That pull request sets the version in both packages.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tag:
    name: Check tag is typescript-v*
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - id: check
        env:
          # A release event carries its tag; a workflow_dispatch run must be on the tag.
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag && "$TAG_NAME" == typescript-v* ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: check-tag
    if: needs.check-tag.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    # Create an `npm` environment in repo settings to gate publishes behind
    # required reviewers. Publishing uses npm trusted publishing (OIDC): register
    # this repository + workflow + environment as a trusted publisher on the
    # npm package settings. No token is stored anywhere.
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 bundles npm 10, but OIDC trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build

      # Authenticates via the OIDC token exchange (id-token: write), which also
      # generates and uploads the provenance attestation. No NODE_AUTH_TOKEN.
      - name: Publish
        run: npm publish --access public --provenance
