[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-dynamodb-storage"
version = "0.1.2"
description = "Amazon DynamoDB storage backend for the Strands Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Amazon Web Services" }]
keywords = ["strands", "strands-agents", "dynamodb", "storage", "agent", "memory", "aws"]
dependencies = [
    # Floor: 1.48.0 introduced the unified Storage interface and StorageError
    # (strands-agents/harness-sdk #3259). Below it, importing this package fails.
    "strands-agents>=1.48.0",
    "boto3>=1.43.64",
]

[project.urls]
Homepage = "https://github.com/aws/strands-dynamodb-storage"
Repository = "https://github.com/aws/strands-dynamodb-storage"
Issues = "https://github.com/aws/strands-dynamodb-storage/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "moto[dynamodb,s3]>=5",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strands_dynamodb_storage"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "moto[dynamodb,s3]>=5",
    "ruff",
    "mypy",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = "ruff check src tests"
format = "ruff format src tests"
format-check = "ruff format --check src tests"
typecheck = "mypy src"
prepare = ["format", "lint", "typecheck", "test"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Matches strands-agents/extension-template: pycodestyle, pyflakes, isort, bugbear.
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
